$kind: http-request
name: 'create match - invalid date string'
method: POST
url: '{{base_url}}/matches'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sport": "football",
      "homeTeam": "Lions",
      "awayTeam": "Tigers",
      "startTime": "not-a-date",
      "endTime": "2026-10-10T19:45:00Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
